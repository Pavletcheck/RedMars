<?xml version="1.0" encoding="UTF-8"?>
<!-- Портрет Сержанта: марсианский инструктор в тяжёлом шлеме.
     Прозрачный фон, рассчитан на 48–72 px. Палитра сцены:
     песочная броня, красный плащ, золото, бирюзовый визор. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <linearGradient id="spHelm" x1="30" y1="22" x2="64" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0dfb6"/>
      <stop offset=".38" stop-color="#cdb887"/>
      <stop offset=".74" stop-color="#9b8762"/>
      <stop offset="1" stop-color="#6b5a3e"/>
    </linearGradient>
    <linearGradient id="spHelmSide" x1="24" y1="40" x2="38" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8d7a58"/>
      <stop offset="1" stop-color="#58492f"/>
    </linearGradient>
    <linearGradient id="spVisor" x1="32" y1="43" x2="62" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8fff9"/>
      <stop offset=".22" stop-color="#7fe9ff"/>
      <stop offset=".52" stop-color="#46e0c8"/>
      <stop offset=".8" stop-color="#188f8a"/>
      <stop offset="1" stop-color="#0a3f45"/>
    </linearGradient>
    <linearGradient id="spArmor" x1="36" y1="70" x2="60" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7c294"/>
      <stop offset=".55" stop-color="#a08a5f"/>
      <stop offset="1" stop-color="#5f5038"/>
    </linearGradient>
    <linearGradient id="spPauldron" x1="20" y1="68" x2="40" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2cfa2"/>
      <stop offset=".55" stop-color="#b09a6c"/>
      <stop offset="1" stop-color="#6d5b3d"/>
    </linearGradient>
    <linearGradient id="spRed" x1="34" y1="72" x2="62" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4573c"/>
      <stop offset="1" stop-color="#8e2f23"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="0" cy="0" r="1" gradientTransform="translate(48 51) rotate(90) scale(12 22)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46e0c8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#46e0c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- мягкое свечение визора на тёмном фоне панели -->
  <ellipse cx="48" cy="51" rx="22" ry="12" fill="url(#spGlow)"/>

  <!-- плечи и наплечники: широкий силуэт, читаемый в 48 px -->
  <path d="M8 95c1-11 6-17 15-20l10 5 4 5-2 10H8z" fill="url(#spPauldron)" stroke="#3f3423" stroke-width="1.4"/>
  <path d="M88 95c-1-11-6-17-15-20l-10 5-4 5 2 10h27z" fill="url(#spPauldron)" stroke="#3f3423" stroke-width="1.4"/>
  <path d="M8 95c1-8 4-13 10-16l7 3-2 13H8z" fill="#57482f" opacity=".55"/>
  <path d="M88 95c-1-8-4-13-10-16l-7 3 2 13h15z" fill="#57482f" opacity=".55"/>

  <!-- золотая кромка и заклёпки наплечников -->
  <path d="M12 82c5-8 10-11 17-12" stroke="#ffcf4a" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  <path d="M84 82c-5-8-10-11-17-12" stroke="#ffcf4a" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  <path d="M17 88l7-3M79 88l-7-3" stroke="#8e2f23" stroke-width="2" stroke-linecap="round"/>
  <circle cx="19" cy="86" r="1.6" fill="#ffe9a8"/>
  <circle cx="77" cy="86" r="1.6" fill="#ffe9a8"/>
  <circle cx="13.5" cy="92" r="1.2" fill="#ffcf4a"/>
  <circle cx="82.5" cy="92" r="1.2" fill="#ffcf4a"/>

  <!-- шевроны на левом наплечнике: сержант -->
  <path d="M18 91l6-3 6 3M19 87l5-2.4 5 2.4" stroke="#ffcf4a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- корпус и красный воротник -->
  <path d="M33 95l2-16c4-4 9-6 13-6s9 2 13 6l2 16H33z" fill="url(#spArmor)" stroke="#3f3423" stroke-width="1.3"/>
  <path d="M32 77c5-4 10-6 16-6s11 2 16 6l-2 6c-4-3-9-5-14-5s-10 2-14 5l-2-6z" fill="url(#spRed)" stroke="#5e1f17" stroke-width="1"/>
  <path d="M37 81c3-2 7-3 11-3s8 1 11 3" stroke="#ffcf4a" stroke-width="1.3" stroke-linecap="round" opacity=".85"/>

  <!-- нагрудная пластина и красная нашивка -->
  <path d="M42 86h12l1 9H41l1-9z" fill="#8b7752" stroke="#4b3f2b" stroke-width="1"/>
  <path d="M45 88h6v2.4h-6z" fill="#b23a2c"/>
  <circle cx="48" cy="93" r="1.3" fill="#ffcf4a"/>

  <!-- шея и затылочные крепления -->
  <path d="M42 65h12v6H42z" fill="#4c402c"/>
  <path d="M40 66h16" stroke="#2f271b" stroke-width="2" stroke-linecap="round"/>

  <!-- боковые "уши" шлема -->
  <circle cx="27" cy="49" r="7" fill="#4b3f2b"/>
  <circle cx="27" cy="49" r="4.6" fill="#8a7753"/>
  <circle cx="69" cy="49" r="7" fill="#4b3f2b"/>
  <circle cx="69" cy="49" r="4.6" fill="#8a7753"/>
  <circle cx="27" cy="49" r="1.5" fill="#ffcf4a"/>
  <circle cx="69" cy="49" r="1.5" fill="#ffcf4a"/>

  <!-- купол шлема -->
  <path d="M28 49c0-15 8-25 20-27 12 2 20 12 20 27l-1 7c-4 5-11 8-19 8s-15-3-19-8l-1-7z" fill="url(#spHelm)" stroke="#4a3e2b" stroke-width="1.5"/>
  <path d="M29 47c1-9 6-17 13-21l-3 7c-4 4-7 9-8 16l-2-2z" fill="url(#spHelmSide)" opacity=".55"/>
  <path d="M32 31c4-5 10-8 16-9" stroke="#fff2cf" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <!-- гребень и красная полоса -->
  <path d="M45 22h6l2 17H43l2-17z" fill="#e5d3a5" stroke="#6d5b3d" stroke-width=".8"/>
  <path d="M46.5 22.2h3l1.1 13h-5.2l1.1-13z" fill="#b23a2c"/>
  <path d="M43.4 39h9.2" stroke="#5b4a30" stroke-width="1.3" stroke-linecap="round"/>

  <!-- надбровная плита с золотой кромкой -->
  <path d="M30.5 42h35L64 47H32l-1.5-5z" fill="#4a3f2c" stroke="#332c1f" stroke-width="1"/>
  <path d="M32 44.2h32" stroke="#ffcf4a" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>

  <!-- бирюзовый визор: главный акцент портрета -->
  <path d="M31.5 46.5h33l-2.4 9.2c-4.6 3-9.3 4.4-14.1 4.4s-9.5-1.4-14.1-4.4l-2.4-9.2z" fill="url(#spVisor)" stroke="#0a3438" stroke-width="1.4"/>
  <path d="M35 47.8h12.5l-1.8 3.2H36.2L35 47.8z" fill="#eafffd" opacity=".6"/>
  <path d="M33.6 55.6c5 2.5 10 3.7 14.4 3.7s9.4-1.2 14.4-3.7" stroke="#bffcf3" stroke-width="1" opacity=".4" stroke-linecap="round"/>
  <path d="M35 51h26" stroke="#0b5a5c" stroke-width=".8" opacity=".55"/>

  <!-- дыхательная маска и вентиляция -->
  <path d="M37.5 60c3.3 2.4 6.8 3.6 10.5 3.6S55.2 62.4 58.5 60l-1.2 5.4c-2.9 2.1-6.2 3.1-9.3 3.1s-6.4-1-9.3-3.1L37.5 60z" fill="#3e3526" stroke="#241e15" stroke-width="1"/>
  <path d="M43 64h10M44 66.3h8" stroke="#ffcf4a" stroke-width="1" stroke-linecap="round" opacity=".75"/>

  <!-- антенна с бирюзовым огоньком и красным вымпелом -->
  <path d="M68 31l12-15" stroke="#d9c697" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M67.2 31.8l7.4-4.5-1.8 6.2-5.6-1.7z" fill="#b23a2c" stroke="#7a251c" stroke-width=".8"/>
  <circle cx="80.8" cy="15.4" r="4.6" fill="#46e0c8" opacity=".28"/>
  <circle cx="80.8" cy="15.4" r="2.3" fill="#7fe9ff"/>
  <circle cx="80.8" cy="15.4" r="1" fill="#efffff"/>

  <!-- блик по кромке купола и золотые болты -->
  <path d="M34 30c4-5 9-8 14-9" stroke="#fff6d8" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
  <circle cx="37" cy="38" r="1.1" fill="#ffe9a8"/>
  <circle cx="59" cy="38" r="1.1" fill="#ffe9a8"/>
  <path d="M34 57.5c-2-1-3.4-2.4-4.3-4.1" stroke="#7fe9ff" stroke-width="1" opacity=".35" stroke-linecap="round"/>
</svg>
