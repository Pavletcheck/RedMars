<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="l1t l1d">
  <title id="l1t">Прибытие на Марс</title>
  <desc id="l1d">Посадочный модуль над колонией, пыль и Сержант в шлеме на переднем плане.</desc>
  <defs>
    <linearGradient id="l1-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17131c"/>
      <stop offset=".45" stop-color="#382026"/>
      <stop offset=".7" stop-color="#7c3b2d"/>
      <stop offset=".86" stop-color="#c06a44"/>
      <stop offset="1" stop-color="#6d3020"/>
    </linearGradient>
    <radialGradient id="l1-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe5b5" stop-opacity=".9"/>
      <stop offset=".3" stop-color="#f4b77e" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f4b77e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l1-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a15434"/>
      <stop offset=".55" stop-color="#7a3825"/>
      <stop offset="1" stop-color="#3b1c15"/>
    </linearGradient>
    <linearGradient id="l1-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ded8"/>
      <stop offset=".45" stop-color="#899597"/>
      <stop offset="1" stop-color="#3d4a4e"/>
    </linearGradient>
    <linearGradient id="l1-visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6f70"/>
      <stop offset=".5" stop-color="#7fe9ff"/>
      <stop offset="1" stop-color="#46e0c8"/>
    </linearGradient>
    <linearGradient id="l1-armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3833"/>
      <stop offset=".55" stop-color="#252322"/>
      <stop offset="1" stop-color="#121315"/>
    </linearGradient>
    <linearGradient id="l1-dust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9b98d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e9b98d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e9b98d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="260" fill="url(#l1-sky)"/>
  <ellipse cx="176" cy="120" rx="150" ry="90" fill="url(#l1-sun)"/>

  <!-- звёзды и пыль -->
  <g fill="#ffd9ae">
    <circle cx="82" cy="38" r="1.2" opacity=".4"/>
    <circle cx="138" cy="52" r="1" opacity=".32"/>
    <circle cx="312" cy="29" r="1.1" opacity=".35"/>
    <circle cx="382" cy="61" r=".9" opacity=".28"/>
    <circle cx="238" cy="24" r="1.4" opacity=".3"/>
    <circle cx="530" cy="41" r="1.1" opacity=".4"/>
  </g>

  <!-- дальние гряды -->
  <path d="M0 151 58 120 94 132 138 108 184 129 226 117 274 138 330 126 380 141 430 122 482 137 536 119 590 135 640 124v30H0z" fill="#4a2622" opacity=".8"/>
  <path d="M0 162 66 145 118 152 172 139 228 154 286 146 346 158 408 143 470 154 534 142 590 153 640 146v24H0z" fill="#2e1a18" opacity=".85"/>

  <!-- колония на горизонте -->
  <g opacity=".9">
    <path d="M228 156c0-10 7-17 17-17s17 7 17 17z" fill="#6f7776"/>
    <rect x="230" y="155" width="30" height="5" rx="2" fill="#3e4749"/>
    <path d="M270 157c0-7 5-12 12-12s12 5 12 12z" fill="#596362"/>
    <rect x="271" y="156" width="22" height="4" fill="#313b3d"/>
    <rect x="308" y="148" width="2" height="13" fill="#697271"/>
    <rect x="303" y="144" width="12" height="4" rx="1" fill="#87918e"/>
    <rect x="326" y="151" width="24" height="9" rx="2" fill="#4c5657"/>
    <rect x="330" y="149" width="16" height="3" rx="1" fill="#76807e"/>
    <rect x="360" y="153" width="1.6" height="10" fill="#6b7472"/>
    <circle cx="361" cy="152" r="2" fill="#46e0c8" opacity=".55"/>
  </g>

  <!-- посадочный модуль -->
  <g>
    <ellipse cx="430" cy="169" rx="66" ry="14" fill="#3a1e17" opacity=".65"/>
    <path d="M402 93 456 89 477 121 443 143 400 130z" fill="url(#l1-metal)"/>
    <path d="M405 99 454 95 470 119 440 135 405 125z" fill="#b7c1bd" opacity=".45"/>
    <path d="M410 120 446 115 460 128 430 139 406 131z" fill="#2d3a3e"/>
    <rect x="424" y="101" width="22" height="7" rx="2" fill="#7fe9ff" opacity=".55"/>
    <path d="M414 132 400 166M447 133 455 167M425 137 420 167" stroke="#3b4546" stroke-width="4" stroke-linecap="round"/>
    <path d="M392 161 414 155M446 156 474 162" stroke="#647170" stroke-width="3" stroke-linecap="round"/>
    <path d="M456 118 476 111 480 119 460 126z" fill="#ffcf4a" opacity=".65"/>
    <circle cx="405" cy="105" r="2.2" fill="#eafffb"/>
  </g>

  <!-- пыль от посадки -->
  <ellipse cx="430" cy="172" rx="95" ry="22" fill="url(#l1-dust)"/>
  <ellipse cx="390" cy="180" rx="55" ry="14" fill="#d99c72" opacity=".12"/>
  <ellipse cx="488" cy="183" rx="64" ry="15" fill="#d99c72" opacity=".1"/>

  <!-- грунт переднего плана -->
  <path d="M0 176 640 170v90H0z" fill="url(#l1-ground)"/>
  <g fill="#5f2b1d" opacity=".5">
    <ellipse cx="132" cy="219" rx="24" ry="5"/>
    <ellipse cx="338" cy="237" rx="30" ry="6"/>
    <ellipse cx="545" cy="226" rx="20" ry="4"/>
  </g>
  <g fill="#c98962" opacity=".18">
    <ellipse cx="204" cy="194" rx="42" ry="7"/>
    <ellipse cx="475" cy="205" rx="56" ry="8"/>
  </g>

  <!-- Сержант: бюст на переднем плане -->
  <g>
    <path d="M442 260c4-50 26-77 72-77s68 27 72 77z" fill="url(#l1-armor)"/>
    <path d="M458 218c10-16 28-24 54-24s46 8 56 24l-8 14-45-9-48 10z" fill="#2d2b28"/>
    <path d="M470 202c8-12 22-19 42-19s35 7 43 19l-10 11-33-7-33 8z" fill="#47423a"/>
    <!-- шлем -->
    <ellipse cx="512" cy="168" rx="52" ry="55" fill="#2a2722"/>
    <path d="M462 171c0-34 22-55 50-55s50 21 50 55l-8 6-42-8-42 8z" fill="#cdb98c"/>
    <path d="M468 168c2-27 20-44 44-44s42 17 44 44l-9 4-35-6-35 6z" fill="#a8946b"/>
    <path d="M469 177c4 26 19 41 43 41s39-15 43-41l-10-8-33 8-33-8z" fill="#b8a67b"/>
    <!-- визор -->
    <rect x="476" y="165" width="72" height="22" rx="9" fill="#162b2d"/>
    <rect x="481" y="169" width="62" height="14" rx="7" fill="url(#l1-visor)"/>
    <rect x="488" y="171" width="25" height="5" rx="2.5" fill="#eafffb" opacity=".7"/>
    <!-- гребень и антенна -->
    <rect x="506" y="108" width="10" height="18" rx="3" fill="#a77a3d"/>
    <path d="M512 108 520 103 512 98z" fill="#d7a94d"/>
    <path d="M552 138 572 120" stroke="#8f9a96" stroke-width="2" stroke-linecap="round"/>
    <circle cx="574" cy="118" r="3.5" fill="#46e0c8"/>
    <circle cx="574" cy="118" r="8" fill="#46e0c8" opacity=".12"/>
    <!-- дыхательная маска -->
    <path d="M489 189h48l-9 20h-30z" fill="#6d6046" opacity=".9"/>
    <path d="M497 196h32M501 202h24" fill="none" stroke="#332c22" stroke-width="2"/>
    <!-- плечевая лампа -->
    <rect x="455" y="205" width="10" height="5" rx="2" fill="#ffcf4a" opacity=".7"/>
    <path d="M445 216 428 230 430 238 452 224z" fill="#3b3832"/>
  </g>

  <!-- передняя пыль -->
  <ellipse cx="508" cy="249" rx="132" ry="18" fill="#c27a52" opacity=".1"/>
  <path d="M0 244c80-8 160-2 240 4s180-4 260 0 120 6 140 4v8H0z" fill="#351914" opacity=".55"/>
</svg>
