    <!-- верхний маяк -->
    <circle cx="263" cy="101" r="8" fill="#1a262b"/>
    <circle cx="263" cy="101" r="5.4" fill="#46e0c8"/>
    <circle cx="263" cy="99.6" r="2.2" fill="#eafffb"/>
    <circle cx="263" cy="101" r="15" fill="url(#v-lamp)" opacity=".8"/>
    <path d="M263 90 267 96 263 102 259 96z" fill="#ffcf4a"/>
  </g>

  <!-- перекладина и красное полотнище -->
  <g>
    <path d="M196 116 326 116 326 123 196 123z" fill="#1d262b"/>
    <path d="M199 116 323 116 323 119 199 119z" fill="url(#v-gold)"/>
    <circle cx="198" cy="119.5" r="4" fill="url(#v-gold)"/>
    <circle cx="324" cy="119.5" r="4" fill="url(#v-gold)"/>

    <path d="M205 121 316 121 316 188 Q304 200 294 191 Q284 182 274 192 Q264 202 254 192 Q244 182 234 192 Q224 202 214 193 L205 188z" fill="url(#v-banner)"/>
    <path d="M205 121 316 121 316 130 205 130z" fill="#7c1b18" opacity=".55"/>
    <path d="M238 124 250 186 241 190 230 126z" fill="#6e1614" opacity=".42"/>
    <path d="M284 124 296 186 287 190 275 126z" fill="#e16a4e" opacity=".18"/>
    <path d="M205 121 316 121 316 126 205 126z" fill="#ffcf4a" opacity=".65"/>
    <path d="M205 184 212 192 224 202 234 192 244 182 254 192 264 202 274 192 284 182 294 192 304 199 316 188" fill="none" stroke="#5b120f" stroke-width="2" opacity=".5"/>
