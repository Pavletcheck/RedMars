      <path d="M270 143 288 141"/>
      <path d="M243 170 254 168"/>
      <path d="M298 156 306 155"/>
    </g>

    <!-- золотая звезда -->
    <path d="M260 139 267.6 155.5 285.7 157.4 272.2 169.4 276 187.2 260 178.4 244 187.2 247.8 169.4 234.3 157.4 252.4 155.5z" fill="url(#v-gold)"/>
    <path d="M260 139 267.6 155.5 260 160 252.4 155.5z" fill="#fff6cc" opacity=".7"/>
    <path d="M260 178.4 276 187.2 272.2 169.4z" fill="#8e5910" opacity=".55"/>
    <circle cx="260" cy="162" r="34" fill="none" stroke="#ffcf4a" stroke-width="1.4" opacity=".35"/>
  </g>

  <!-- бирюзовые огни и мелкие детали -->
  <g>
    <circle cx="185" cy="238" r="4" fill="url(#v-lamp)"/>
    <circle cx="185" cy="238" r="1.6" fill="#dffffb"/>
    <circle cx="332" cy="229" r="3.6" fill="url(#v-lamp)"/>
    <circle cx="332" cy="229" r="1.4" fill="#cffff8"/>
    <circle cx="209" cy="214" r="2.8" fill="url(#v-lamp)" opacity=".8"/>
    <circle cx="310" cy="247" r="2.8" fill="url(#v-lamp)" opacity=".8"/>
    <path d="M184 252 192 252 190 258 182 258z" fill="#ffcf4a" opacity=".55"/>
    <path d="M322 252 331 252 328 258 320 258z" fill="#ffcf4a" opacity=".4"/>
  </g>

  <!-- передние камни и осколки -->
  <g opacity=".85">
    <path d="M112 268 146 261 164 270 134 278z" fill="#5a4438"/>
    <path d="M118 267 144 263 152 268 132 273z" fill="#8a6a56"/>
    <path d="M362 265 398 257 414 266 382 274z" fill="#4d3a31"/>
    <path d="M370 264 396 260 404 265 382 270z" fill="#7a5c4b"/>
    <path d="M232 272 248 269 256 274 240 277z" fill="#6b5244" opacity=".6"/>
  </g>
</svg>
