      <circle cx="216" cy="245" r="1.8"/>
      <circle cx="290" cy="243" r="1.8"/>
      <circle cx="344" cy="243" r="2"/>
    </g>
    <g stroke="#7c878a" stroke-width="1" opacity=".6">
      <path d="M232 220 270 217"/>
      <path d="M248 250 274 248"/>
      <path d="M310 244 336 242"/>
    </g>
    <!-- рваная панель и кабель -->
    <path d="M166 228 158 205 176 210 184 228z" fill="#425158"/>
    <path d="M336 214 352 194 363 203 348 222z" fill="#54636a"/>
    <path d="M348 216 C376 226 380 240 366 256" fill="none" stroke="#1f2b30" stroke-width="3"/>
    <path d="M348 216 C372 224 376 236 364 249" fill="none" stroke="#869396" stroke-width="1" opacity=".6"/>
    <circle cx="366" cy="256" r="2.4" fill="#b9c5c5"/>
  </g>

  <!-- штандарт -->
  <g>
    <path d="M254 246 262 102 268 102 266 246z" fill="#2b343a"/>
    <path d="M257 244 263 106 267 106 264 244z" fill="url(#v-metal-light)"/>
    <path d="M250 112 276 112 276 120 250 120z" fill="url(#v-gold)"/>
    <path d="M254 138 270 138 270 143 254 143z" fill="#c89227"/>
    <g stroke="#e0c06a" stroke-width="1" opacity=".55">
      <path d="M259 128 264 128"/>
      <path d="M258 156 265 156"/>
      <path d="M257 198 265 198"/>
