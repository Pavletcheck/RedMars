<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="vt vd">
  <title id="vt">Победа колонии</title>
  <desc id="vd">Марсианский штандарт: обломок модуля, красное полотнище, золотая звезда и бирюзовые огни.</desc>
  <defs>
    <radialGradient id="v-glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#ffcf4a" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#c7462f" stop-opacity=".12"/>
      <stop offset="1" stop-color="#c7462f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9b3b6"/>
      <stop offset=".38" stop-color="#68757b"/>
      <stop offset=".7" stop-color="#48545a"/>
      <stop offset="1" stop-color="#2d373d"/>
    </linearGradient>
    <linearGradient id="v-metal-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5dcdb"/>
      <stop offset=".55" stop-color="#8c989b"/>
      <stop offset="1" stop-color="#566267"/>
    </linearGradient>
    <linearGradient id="v-banner" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#d6503b"/>
      <stop offset=".42" stop-color="#b63429"/>
      <stop offset=".78" stop-color="#8d211d"/>
      <stop offset="1" stop-color="#681714"/>
    </linearGradient>
    <linearGradient id="v-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b5"/>
      <stop offset=".35" stop-color="#ffcf4a"/>
      <stop offset=".72" stop-color="#d99a25"/>
      <stop offset="1" stop-color="#996113"/>
    </linearGradient>
    <radialGradient id="v-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#eafffb"/>
      <stop offset=".3" stop-color="#7fe9ff"/>
      <stop offset="1" stop-color="#46e0c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v-rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a85a32"/>
      <stop offset="1" stop-color="#632d1c"/>
    </linearGradient>
  </defs>

  <ellipse cx="260" cy="162" rx="228" ry="136" fill="url(#v-glow)"/>

  <!-- дальние лучи и пыль -->
  <g opacity=".3">
    <path d="M260 44 244 128h10L232 220h56l-22-92h10z" fill="#ffcf4a" opacity=".12"/>
    <path d="M96 92 244 142l-4 9L92 104z" fill="#c7462f" opacity=".12"/>
    <path d="M424 92 276 142l4 9 148-47z" fill="#c7462f" opacity=".12"/>
  </g>
  <g fill="#ffdca8">
    <circle cx="88" cy="112" r="2" opacity=".38"/>
    <circle cx="438" cy="98" r="1.6" opacity=".34"/>
    <circle cx="398" cy="206" r="1.4" opacity=".25"/>
    <circle cx="126" cy="226" r="1.8" opacity=".28"/>
    <circle cx="360" cy="68" r="1.2" opacity=".3"/>
  </g>

  <!-- обломок марсианского модуля: основание трофея -->
  <ellipse cx="260" cy="268" rx="154" ry="18" fill="#2a100d" opacity=".5"/>
  <g>
    <path d="M146 244 174 218 332 210 378 234 356 262 190 268z" fill="#2d373d"/>
    <path d="M154 243 180 222 330 215 368 235 350 250 194 256z" fill="url(#v-metal)"/>
    <path d="M154 243 180 222 330 215 340 218 191 228 168 247z" fill="url(#v-metal-light)" opacity=".8"/>
    <path d="M188 246 352 238 348 250 194 256z" fill="#3f4a50"/>
    <path d="M198 234 236 230 226 246 190 249z" fill="url(#v-rust)" opacity=".75"/>
    <path d="M300 226 330 223 344 236 312 241z" fill="#8f472b" opacity=".55"/>
    <path d="M176 240 200 229 206 232 184 244z" fill="#d9e0dd" opacity=".18"/>
    <g fill="#1d2529">
