<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="dt dd">
  <title id="dt">Поражение</title>
  <desc id="dd">Приглушённый марсианский штандарт: наклонённая стойка, порванное полотнище, дым и погасшие огни.</desc>
  <defs>
    <radialGradient id="d-glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#9d6c4d" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#542b28" stop-opacity=".1"/>
      <stop offset="1" stop-color="#2c2526" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="d-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e8585"/>
      <stop offset=".45" stop-color="#565d5f"/>
      <stop offset="1" stop-color="#343a3c"/>
    </linearGradient>
    <linearGradient id="d-metal-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa09d"/>
      <stop offset=".6" stop-color="#687071"/>
      <stop offset="1" stop-color="#464d4f"/>
    </linearGradient>
    <linearGradient id="d-banner" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#7f3b32"/>
      <stop offset=".5" stop-color="#63302b"/>
      <stop offset="1" stop-color="#3d2322"/>
    </linearGradient>
    <linearGradient id="d-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b79a5c"/>
      <stop offset=".5" stop-color="#8d7342"/>
      <stop offset="1" stop-color="#5e4a2b"/>
    </linearGradient>
    <linearGradient id="d-rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#784330"/>
      <stop offset="1" stop-color="#4b2a22"/>
    </linearGradient>
    <radialGradient id="d-smoke" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#9b948c" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#716d68" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5d5b58" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d-ember" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a66" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#b84a32" stop-opacity=".4"/>
      <stop offset="1" stop-color="#7b2c22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="260" cy="160" rx="232" ry="140" fill="url(#d-glow)"/>

  <!-- дым за штандартом -->
  <g>
    <ellipse cx="200" cy="112" rx="78" ry="58" fill="url(#d-smoke)"/>
    <ellipse cx="318" cy="96" rx="66" ry="52" fill="url(#d-smoke)" opacity=".8"/>
    <ellipse cx="260" cy="132" rx="110" ry="46" fill="url(#d-smoke)" opacity=".5"/>
    <path d="M212 126 C190 102 196 68 226 54 C246 44 256 30 252 12" fill="none" stroke="#8f8a84" stroke-width="6" stroke-linecap="round" opacity=".12"/>
    <path d="M316 120 C338 94 330 64 308 46" fill="none" stroke="#7f7a75" stroke-width="7" stroke-linecap="round" opacity=".1"/>
  </g>

  <ellipse cx="258" cy="268" rx="156" ry="19" fill="#1e1414" opacity=".55"/>

  <!-- разбитое основание -->
  <g>
    <path d="M142 246 174 220 326 214 376 238 354 264 184 269z" fill="#262d30"/>
    <path d="M152 244 181 224 324 219 357 237 342 252 188 257z" fill="url(#d-metal)"/>
    <path d="M152 244 181 224 324 219 330 222 188 230 169 248z" fill="url(#d-metal-light)" opacity=".55"/>
    <path d="M186 247 346 241 342 252 188 257z" fill="#394144"/>
    <path d="M196 233 228 229 220 246 188 249z" fill="url(#d-rust)" opacity=".7"/>
    <path d="M300 226 338 222 350 236 314 241z" fill="#4b2a22" opacity=".75"/>
    <path d="M234 222 254 220 248 244 231 246z" fill="#22292c" opacity=".6"/>
    <path d="M260 219 264 239 256 242 253 220z" fill="#1a2023" opacity=".55"/>
    <g fill="#171d1f">
      <circle cx="191" cy="247" r="2"/>
      <circle cx="216" cy="244" r="1.8"/>
      <circle cx="290" cy="243" r="1.8"/>
      <circle cx="338" cy="243" r="2"/>
    </g>
    <path d="M162 229 154 208 172 213 180 230z" fill="#3b4649"/>
    <path d="M342 219 358 199 367 208 352 225z" fill="#414b4d"/>
    <path d="M156 238 C132 246 126 260 140 274" fill="none" stroke="#20282c" stroke-width="3"/>
    <path d="M356 228 C382 236 390 252 378 268" fill="none" stroke="#1c2428" stroke-width="3"/>
    <path d="M350 242 366 254" stroke="#788180" stroke-width="1.2" opacity=".5"/>
  </g>

  <!-- наклонённый штандарт -->
  <g>
    <path d="M302 252 234 104 241 101 311 250z" fill="#232b2f"/>
    <path d="M304 249 238 108 242 106 309 247z" fill="url(#d-metal-light)" opacity=".8"/>
    <path d="M232 112 260 105 265 111 237 118z" fill="url(#d-gold)" opacity=".65"/>
    <path d="M254 146 268 140 272 144 258 150z" fill="#7f6842" opacity=".8"/>
    <!-- верхний узел без маяка -->
    <circle cx="248" cy="102" r="8" fill="#222a2d"/>
    <circle cx="248" cy="102" r="4.8" fill="#4b5657"/>
    <circle cx="248" cy="102" r="2.2" fill="#2c3537"/>
    <path d="M248 94 252 100 248 106 244 100z" fill="#7a663f" opacity=".8"/>
    <path d="M240 96 224 84" stroke="#6d7574" stroke-width="2" stroke-linecap="round"/>
    <circle cx="222" cy="82" r="7" fill="#343d3f" opacity=".8"/>
    <circle cx="222" cy="82" r="3" fill="#1f2729"/>
  </g>

  <!-- порванное полотнище -->
  <g>
    <path d="M242 116 258 112 313 207 301 217 289 204 279 222 266 210 254 224 246 208z" fill="url(#d-banner)"/>
    <path d="M242 116 258 112 262 124 246 128z" fill="#502723" opacity=".65"/>
    <path d="M268 138 280 160 271 166 259 144z" fill="#402522" opacity=".4"/>
    <path d="M290 180 301 202 292 210 281 188z" fill="#853e35" opacity=".2"/>
    <path d="M242 116 258 112 259 117 243 121z" fill="#9b7e4b" opacity=".55"/>
    <g stroke="#b59463" stroke-width="1" opacity=".22">
      <path d="M255 132 272 137"/>
      <path d="M264 156 283 162"/>
      <path d="M277 182 294 189"/>
    </g>
    <!-- потухшая звезда на полотнище -->
    <path d="M270 142 276 154 289 155 279 164 282 177 270 171 258 177 261 164 251 155 264 154z" fill="url(#d-gold)" opacity=".8"/>
    <path d="M270 142 276 154 270 158 264 154z" fill="#c3ac7a" opacity=".3"/>
    <circle cx="270" cy="160" r="29" fill="none" stroke="#8d7342" stroke-width="1" opacity=".2"/>
  </g>

  <!-- погасшие огни и тлеющие искры -->
  <g>
    <circle cx="186" cy="239" r="3.4" fill="#3f4b4b"/>
    <circle cx="186" cy="239" r="1.2" fill="#667674"/>
    <circle cx="330" cy="230" r="3" fill="#3b4647"/>
    <circle cx="330" cy="230" r="1" fill="#5d6b69"/>
    <circle cx="222" cy="214" r="2.2" fill="#334042"/>
    <circle cx="310" cy="246" r="2.2" fill="#334042"/>
    <circle cx="268" cy="258" r="10" fill="url(#d-ember)" opacity=".65"/>
    <circle cx="268" cy="258" r="2.2" fill="#e37a50" opacity=".8"/>
    <circle cx="182" cy="258" r="7" fill="url(#d-ember)" opacity=".3"/>
    <circle cx="342" cy="254" r="5" fill="url(#d-ember)" opacity=".25"/>
  </g>

  <!-- упавшая звезда и мелкий мусор -->
  <g>
    <path d="M126 254 135 240 146 249 142 259 131 258z" fill="url(#d-gold)" opacity=".55"/>
    <path d="M130 252 135 244 140 250 137 256z" fill="#c2a86e" opacity=".25"/>
    <path d="M106 270 142 263 162 272 130 280z" fill="#4a3931"/>
    <path d="M112 269 140 265 148 270 128 275z" fill="#725c4b"/>
    <path d="M362 266 400 258 418 268 384 276z" fill="#3f332d"/>
    <path d="M370 265 398 261 406 266 382 271z" fill="#655043"/>
    <path d="M228 274 246 271 254 276 236 279z" fill="#5a473c" opacity=".7"/>
    <path d="M300 272 316 269 324 274 308 277z" fill="#57433a" opacity=".6"/>
  </g>

  <!-- пепел -->
  <g fill="#b3a89b" opacity=".25">
    <circle cx="112" cy="120" r="1.6"/>
    <circle cx="410" cy="142" r="1.3"/>
    <circle cx="392" cy="92" r="1.1"/>
    <circle cx="146" cy="190" r="1.2"/>
    <circle cx="350" cy="70" r="1.4"/>
    <circle cx="440" cy="218" r="1.1"/>
  </g>
</svg>
